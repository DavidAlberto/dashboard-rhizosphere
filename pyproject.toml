[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Dashboard Rhizosphere Project"
version = "0.1.0"
description = "A comprehensive dashboard for rhizosphere data analysis"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "dash>=2.10.0",
    "scikit-learn>=1.3.0",
    "tensorflow>=2.13.0",
    "keras>=2.13.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "torchaudio>=2.0.0"
]

[tool.pip]
extra-index-url = "https://download.pytorch.org/whl/cu118"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "flake8>=6.0.0"
]